plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Single build for the whole 26.1.x line: compiled against ${project.minecraft_version}
// but labelled 26.1.x and (via fabric.mod.json ~26.1) compatible with 26.1 / 26.1.1 / 26.1.2.
version = "${project.mod_version}+26.1.x"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Simple Voice Chat API
	maven {
		name = 'Maxhenkel'
		url = 'https://maven.maxhenkel.de/repository/public'
	}
	// Simple Voice Chat mod (runtime) via Modrinth
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	// Mod Menu
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 26.1+ ships unobfuscated (real names baked into the jar), so there are no
	// obfuscation mappings and Loom drops the `mod*` remapping configurations entirely —
	// dependencies are added with plain `implementation` / `runtimeOnly`, no `mappings` line.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// The fabric-api meta only exposes a subset of modules on the compile classpath. In the 26.x
	// (unobfuscated) era the key-binding module was renamed to fabric-key-mapping-api-v1
	// (KeyMappingHelper.registerKeyMapping); declare it explicitly to compile against it.
	implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${project.keymapping_version}"

	// --- Simple Voice Chat plugin API ---
	// Compile against the API...
	implementation "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
	// ...ship the real mod at runtime (dev only)...
	runtimeOnly "maven.modrinth:simple-voice-chat:${project.voicechat_version}"
	// ...and add the Fabric stub so the API classes load in dev (required for api >= 2.6.0).
	runtimeOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}:fabric-stub"

	// --- Mod Menu (config screen entry) ---
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version,
				'minecraft_version': project.minecraft_version,
				'loader_version': project.loader_version
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.archives_base_name}" }
	}
}
